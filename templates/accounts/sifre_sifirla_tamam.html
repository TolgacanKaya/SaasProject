{% extends 'base.html' %}
{% block title %}Şifre Değiştirildi | KobiRandevu{% endblock %}

{% block content %}
<div class="relative min-h-screen flex items-center justify-center pt-36 pb-12 px-4 sm:px-6 lg:px-8 bg-slate-50 overflow-hidden font-sans">

    <div class="absolute top-20 left-1/4 w-96 h-96 bg-emerald-400/20 rounded-full blur-[100px] animate-blob pointer-events-none"></div>
    <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-teal-300/20 rounded-full blur-[100px] animate-blob animation-delay-2000 pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md bg-white rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(16,185,129,0.1)] border border-slate-100 p-8 sm:p-12 text-center animate-[fadeSlideUp_0.6s_ease-out_forwards]">

        <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-[1.5rem] flex items-center justify-center mx-auto mb-8 shadow-sm border border-emerald-100/50 relative group">
            <div class="absolute inset-0 bg-emerald-200/50 rounded-[1.5rem] blur group-hover:blur-md transition-all duration-300 opacity-0 group-hover:opacity-100"></div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-10 h-10 relative z-10">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <h2 class="text-3xl font-black text-slate-900 mb-4 tracking-tight">Şifreniz Değiştirildi!</h2>

        <div class="bg-emerald-50/50 border border-emerald-100/50 rounded-2xl p-5 mb-8">
            <p class="text-slate-500 font-medium leading-relaxed text-sm">
                Harika! Şifreniz başarıyla sıfırlandı. Artık yeni şifrenizle işletme panelinize güvenli bir şekilde giriş yapabilirsiniz.
            </p>
        </div>

        <a href="{% url 'giris' %}" class="group w-full flex justify-center items-center gap-2 py-4 px-4 rounded-2xl text-sm font-black text-white bg-slate-900 hover:bg-emerald-500 transition-all duration-300 transform active:scale-[0.98] shadow-lg hover:shadow-emerald-500/25">
            Hemen Giriş Yap
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 group-hover:translate-x-1 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
        </a>
    </div>
</div>

<style>
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blob { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(20px, -30px) scale(1.1); } 66% { transform: translate(-10px, 10px) scale(0.9); } 100% { transform: translate(0, 0) scale(1); } }
    .animate-blob { animation: blob 10s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }
</style>
{% endblock %}
