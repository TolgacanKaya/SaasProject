<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şube Ekle | T-Randevu</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <div class="absolute top-[-20%] right-[-10%] w-[500px] h-[500px] bg-emerald-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="z-10 w-full max-w-md px-4 animate-fade-in">

        <div class="glass-panel rounded-3xl p-8 md:p-10 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-4 -right-4 w-20 h-20 bg-emerald-500/10 rounded-full blur-xl"></div>

            <div class="text-center mb-8 relative z-10">
                <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-emerald-500/30">
                    <svg class="w-8 h-8 text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                </div>
                <h1 class="text-2xl font-extrabold text-white">Yeni Şube Oluştur</h1>
                <p class="text-slate-400 text-sm font-medium mt-2">Premium avantajlarıyla yeni markanızı anında aktifleştirin.</p>
            </div>

            <form method="POST" class="space-y-6 relative z-10">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Şube / İşletme Adı <span class="text-rose-500">*</span></label>
                    <input type="text" name="name" required placeholder="Örn: Keskin Makas (Kadıköy Şubesi)"
                           class="w-full bg-slate-900/80 border border-slate-700 text-white px-4 py-3.5 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all placeholder-slate-600">
                </div>

                <button type="submit" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-extrabold rounded-xl shadow-lg shadow-emerald-500/20 hover:-translate-y-1 transition-all duration-300 text-lg">
                    Şubeyi Kur ve Başla
                </button>
            </form>

            <div class="mt-6 text-center relative z-10">
                <a href="{% url 'isletme_sec' %}" class="text-sm font-semibold text-slate-500 hover:text-slate-300 transition-colors inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Çalışma Alanlarına Dön
                </a>
            </div>
        </div>

    </div>

</body>
</html>
